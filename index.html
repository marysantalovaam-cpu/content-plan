<!doctype html>
<html lang="ru" data-storage="firebase">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><title>Редакция · Алёмаркетинг</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,600;0,700;1,400;1,700&amp;display=swap">
<style>:root{--paper:#f6f7f3;--white:#fff;--ink:#202927;--muted:#586660;--border:#dce3dd;--green:#234b3c;--green-2:#e4eee6;--red:#a12d49;--round:14px;font:16px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #568577;outline-offset:2px}
button:disabled{cursor:default;opacity:.5}
a{color:var(--green)}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2rem,3.3vw,3.4rem);font-weight:730;line-height:1.05;letter-spacing:-.065em}
h2{font-size:1.35rem;line-height:1.2;letter-spacing:-.03em}
h3{font-size:1.04rem}
small,.subtle{color:var(--muted);font-size:.85rem}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:27px 14px 16px;background:#fcfcfa;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:36px}
.brand{display:flex;align-items:center;gap:11px;padding:0 9px;line-height:1.25}
.brand strong,.brand small,.sync strong,.sync small{display:block}
.brand strong{font-size:1.16rem;letter-spacing:-.025em}
.brand-mark{display:grid;place-items:center;background:var(--green);color:white;width:40px;height:40px;border-radius:12px;font-size:25px;flex:none}
nav{display:grid;gap:4px}
nav p{margin:17px 12px 5px;color:var(--muted);font-size:.79rem;font-weight:650}
.nav{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:9px;padding:9px 11px;color:var(--muted);white-space:nowrap;font-size:.91rem;font-weight:590}
.nav:hover,.nav[aria-current="page"]{background:var(--green-2);color:var(--green)}
.nav[aria-current="page"]{font-weight:720}
.nav-icon{display:inline-grid;place-items:center;min-width:20px;font-size:1.15rem;line-height:1}
.sync{margin-top:auto;padding:12px 10px;display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--border)}
.sync>span{width:7px;height:7px;background:#71a98a;border-radius:50%;flex:none}
.sync strong{font-size:.8rem}
main{min-width:0;padding:32px clamp(16px,3vw,45px) 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:23px}
.top p{margin-top:10px}
.btn{border:1px solid var(--border);border-radius:9px;background:var(--white);font-size:.9rem;font-weight:640;padding:8px 12px;line-height:1.35;white-space:nowrap}
.btn:hover{background:#edf2ee}
.primary{background:var(--green);border-color:var(--green);color:white}
.primary:hover{background:#30634f}
.danger{color:var(--red)}
.icon{padding:5px 9px;font-size:1rem}
.toolbar,.filters,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar{justify-content:space-between;margin:0 0 12px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls h2{min-width:190px;text-transform:capitalize}
input,select,textarea{border:1px solid var(--border);border-radius:8px;background:var(--white);padding:7px 9px;min-width:0;width:100%;font-size:.92rem}
textarea{min-height:95px;resize:vertical}
select[multiple]{min-height:102px}
input[type=checkbox]{width:auto}
.filters input,.filters select{width:auto;max-width:100%}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.metric{padding:13px 15px;border:1px solid var(--border);border-radius:var(--round);background:#fbfcf9;display:flex;justify-content:space-between;align-items:center;gap:7px;font-size:.9rem;color:var(--muted)}
.metric strong{color:var(--ink);font-size:1.4rem;line-height:1}
.metric.warn strong{color:var(--red)}
.panel,.cal-scroll,.table-wrap{border:1px solid var(--border);border-radius:var(--round);background:var(--white)}
.cal-scroll,.table-wrap{overflow:auto}
.calendar{min-width:760px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border)}
.weekday{padding:8px;color:var(--muted);font-size:.88rem;font-weight:650;background:#f8faf7}
.day{min-height:110px;min-width:0;padding:5px;background:#fff;display:flex;flex-direction:column;gap:4px}
.day.outside{background:#f4f6f2}
.day.today{background:#eef5ec}
.day.drag-over{outline:2px solid #527f6f;outline-offset:-2px}
.day-add{border:0;background:transparent;border-radius:6px;text-align:left;padding:2px 6px;font-size:.9rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.day-add:hover{background:var(--green-2);color:var(--green)}
.day.today .day-add{color:var(--green)}
.event,.hint{display:block;width:100%;text-align:left;border:0;border-radius:7px;padding:5px 6px;min-width:0;line-height:1.27;overflow-wrap:anywhere}
.event{background:var(--tint,#e8f0e9);color:#253832;border-left:3px solid var(--accent,#719583);font-size:.82rem;font-weight:675}
.event[draggable=true]{cursor:grab}
.event small{display:block;font-size:.74rem;margin-bottom:2px}
.event:hover,.hint:hover{filter:brightness(.96)}
.event.missed{opacity:.72}.event.late{border-left-color:#b84961}
.hint{background:#f3f5f2;border:1px dashed #bac8bf;font-size:.77rem;color:#445b50}
.hints{display:flex;gap:7px;margin:0 0 10px;flex-wrap:wrap}
.hints .hint{width:auto;padding:6px 9px}
.section{margin-top:25px}
.section>h2,.panel>h2{margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.card,.panel{padding:15px}
.card{display:grid;align-content:start;gap:6px}
.card h3{overflow-wrap:anywhere}
.card p{white-space:pre-wrap;overflow-wrap:anywhere}
.card .btn{justify-self:start}
.empty{padding:15px;color:var(--muted);font-size:.93rem}
table{border-collapse:separate;border-spacing:0;width:100%;text-align:left;font-size:.91rem}
th,td{border-bottom:1px solid var(--border);padding:8px 10px;vertical-align:middle}
thead th{background:#f5f8f4;white-space:nowrap;color:var(--muted);font-weight:650}
tr:last-child td{border-bottom:0}
td input,td select{min-width:135px;background:transparent}
td:first-child,th:first-child{position:sticky;left:0;background:#fff;z-index:1}
th:first-child{background:#f5f8f4}
td .cell-title{min-width:255px}
.cell-text{max-width:320px;min-width:190px}
.cell-text .btn{display:block;width:100%;text-align:left;text-overflow:ellipsis;overflow:hidden}
.badge{display:inline-block;border-radius:6px;padding:2px 6px;background:var(--green-2);font-size:.83rem;white-space:nowrap}
.late-text{color:var(--red)}
.label{display:grid;gap:4px;font-size:.88rem;font-weight:640;min-width:0}
form.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wide{grid-column:1/-1}
.actions{margin-top:8px}
dialog{width:min(700px,calc(100% - 24px));max-height:90dvh;overflow:auto;border:1px solid var(--border);border-radius:18px;padding:0;color:var(--ink)}
dialog::backdrop{background:#182e28aa}
.dialog-head{position:sticky;top:0;background:#fff;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:15px 18px}
.dialog-body{padding:17px 18px}
.dialog-body>.panel,.dialog-body>.actions{margin-top:10px}
.list{display:grid;gap:8px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.line>div{min-width:0;overflow-wrap:anywhere}
.line small{display:block}
.line:last-child{border-bottom:0}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,315px),1fr));gap:16px}
.settings .panel{min-width:0}
.toast{position:fixed;bottom:18px;right:18px;z-index:10;background:var(--green);color:white;border-radius:10px;padding:10px 14px;max-width:calc(100% - 36px)}
.history{white-space:pre-wrap;max-height:230px;overflow:auto}
.pagination{margin:12px 0;justify-content:flex-end}
@media(max-width:900px){.app{grid-template-columns:166px minmax(0,1fr)}.sidebar{padding-left:8px;padding-right:8px}.nav{padding-left:6px}}
@media(max-width:670px){.app{display:block}.sidebar{position:static;height:auto;padding:12px;gap:12px;border-right:0;border-bottom:1px solid var(--border)}nav{display:flex;overflow:auto}nav p{display:none}.sync{display:flex;padding:4px 10px}main{padding:18px 12px 35px}.top{margin-bottom:16px}.metric{display:grid;padding:8px;font-size:.81rem}.top p{font-size:.85rem}}
@media(max-width:430px){form.grid{grid-template-columns:1fr}.top .btn{white-space:normal}.controls h2{min-width:130px;font-size:1.05rem}}
.weekly{min-width:1070px}
.weekly td{vertical-align:top;min-width:115px;white-space:pre-wrap}
.weekly td:first-child{min-width:245px;max-width:270px}
.weekly td small{display:block;margin-top:5px}
.weekly td .btn{margin-top:8px}
.controls select{width:auto}
#dialog .toast{position:fixed}
.dialog-message{margin-bottom:12px;padding:8px 10px;border-radius:8px;background:var(--green-2)}
/* The production sheets */
.sheet-top,.sheet-entry,.sheet-root{max-width:100%;min-width:0}
.sheet-top{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.sheet-filters input{width:min(235px,100%)}
.sheet-actions{margin:0}
.sheet-actions select{width:auto;max-width:145px}
.sheet-actions [aria-pressed=true]{background:#dce9e1;border-color:#8ba999}
.sheet-entry{display:grid;grid-template-columns:minmax(53px,auto) minmax(0,1fr) auto;align-items:center;gap:8px;margin:0 0 7px}
.sheet-address{padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:#eef3ee;color:#335b4a;font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.sheet-status{white-space:nowrap}
.sheet-scroll{position:relative;isolation:isolate;max-height:min(66dvh,720px);min-height:200px;overscroll-behavior:contain}
.sheet-grid{--rowhead:48px;border-collapse:separate;table-layout:fixed;width:max-content;font-size:.89rem}
.sheet-grid col:first-child{width:var(--rowhead)}
.sheet-grid thead{position:sticky;top:0;z-index:5}
.sheet-grid th,.sheet-grid td{height:35px;padding:4px 8px;border:none;border-right:1px solid #e0e7e0;border-bottom:1px solid #e0e7e0}
.sheet-grid thead th{position:relative;height:54px;vertical-align:middle;padding:0;background:#edf3ed}
.sheet-grid .sheet-corner,.sheet-grid .sheet-number{position:sticky;left:0;z-index:3;min-width:var(--rowhead);max-width:var(--rowhead);text-align:center;background:#edf3ed;color:#5c7067;font-weight:500;font-variant-numeric:tabular-nums}
.sheet-grid .sheet-title-col{position:sticky;left:var(--rowhead);z-index:2}
.sheet-grid thead .sheet-title-col,.sheet-grid thead .sheet-corner{z-index:4}
.sheet-grid td{position:relative;background:var(--cell-fill,#fff);color:#283931;outline:0}
.sheet-grid td[aria-readonly=true]{background:#f2f5f2;color:#526159}
.sheet-grid td.sheet-selected{background:var(--cell-fill,#eaf4ed);box-shadow:inset 0 0 0 1px #a4c7b2}
.sheet-grid td.sheet-active{box-shadow:inset 0 0 0 2px #42785e}
.sheet-grid td.sheet-title-col.sheet-active{z-index:3}
.sheet-grid td.sheet-editing{padding:0}
.sheet-grid td.sheet-editing :is(input,select,textarea){min-width:0;max-width:100%;border:0;border-radius:0;background:#fff;padding:5px;height:34px;font-size:.89rem}
.sheet-grid td.sheet-editing textarea{display:block;min-height:70px;resize:vertical}
.sheet-grid .formatted-bold{font-weight:750}
.sheet-header-btn{display:flex;width:100%;min-width:0;align-items:center;justify-content:center;flex-direction:column;gap:3px;background:transparent;border:none;border-radius:0;padding:3px 11px 3px 6px;color:#33574a}
.sheet-header-btn small{color:#527064;font-size:.71rem;line-height:1}
.sheet-header-btn span{display:block;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-resize{position:absolute;right:-3px;top:0;bottom:0;width:10px;padding:0;border:0;background:transparent;z-index:1;cursor:col-resize;touch-action:none}
.sheet-resize:hover,.sheet-resize:focus-visible{background:#87b9a0aa}
.sheet-value{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.sheet-grid tr:last-child td,.sheet-grid tr:last-child th{border-bottom:1px solid #e0e7e0}
.controls{min-width:0}
.controls h2{min-width:0}
.toolbar .filters{min-width:0}
.toolbar .filters>*{min-width:0}
.line{align-items:flex-start;flex-wrap:wrap}
.line>.btn{margin-left:auto}
.card,.panel{overflow-wrap:anywhere}
.dialog-head{align-items:flex-start}
.dialog-head h2{min-width:0;overflow-wrap:anywhere}
@media(max-width:670px){
  .sidebar nav{scrollbar-width:thin;padding-bottom:4px}
  .filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
  .filters input,.filters select,.sheet-filters input{width:100%;max-width:100%}
  .filters input[type=search]{grid-column:1/-1}
  .sheet-entry{grid-template-columns:minmax(50px,auto) minmax(0,1fr)}
  .sheet-status{grid-column:1/-1;white-space:normal}
  .sheet-scroll{max-height:64dvh}
  .sheet-grid .sheet-title-col{position:relative;left:auto;z-index:auto}
  .sheet-grid thead .sheet-title-col{z-index:auto}
  .metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metric{overflow-wrap:anywhere}
}
/* Keep calendar cards inside their own column, including long unbroken strings. */
.event.btn,.hint.btn{box-sizing:border-box;min-inline-size:0;max-inline-size:100%;white-space:normal;word-break:normal;overflow-wrap:anywhere}
.calendar .day{min-inline-size:0;align-items:stretch}
.event>small,.event-title{display:block;min-inline-size:0;max-inline-size:100%;white-space:pre-line;overflow-wrap:anywhere;word-break:normal}
.event-title{line-height:1.35}
.cal-scroll .day .event,.cal-scroll .day .hint{flex:0 0 auto;height:auto}
.sheet-color{display:inline-flex;gap:6px;align-items:center;padding:3px 6px;border:1px solid var(--border);border-radius:8px;background:white;font-size:.83rem;white-space:nowrap}
.sheet-color input{width:28px;height:24px;padding:2px;border:0;cursor:pointer}
.sheet-italic{font-style:italic}
.sheet-grid td.sheet-list-cell{padding-inline-end:27px}
.sheet-dropdown-toggle.btn{position:absolute;right:3px;top:50%;transform:translateY(-50%);padding:1px 5px;line-height:1.25;border-color:#cbd7d0;background:#f5f8f5;border-radius:5px}
.sheet-dropdown{position:fixed;inset:auto;margin:0;width:min(330px,calc(100vw - 20px));max-height:min(300px,70dvh);padding:10px;background:white;color:var(--ink);border:1px solid var(--border);border-radius:9px;overflow:auto;box-shadow:0 8px 30px #1b382734}
.sheet-dropdown-options{display:flex;flex-direction:column;align-items:stretch;gap:3px;margin-top:7px}
.sheet-option{display:flex;align-items:center;gap:9px;padding:5px 8px;white-space:normal;text-align:left;overflow-wrap:anywhere}
.sheet-option input{flex:none}
.sheet-option[aria-current=true]{background:#e4eee6}
.sheet-grid.source-sheet thead th{background:var(--cell-fill,#edf3ed)}
.sheet-grid.source-sheet .sheet-header-btn{font:inherit;color:inherit;text-align:inherit}
.sheet-grid.source-sheet .sheet-header-btn span{white-space:normal;overflow-wrap:anywhere}
.sheet-grid .sheet-wrap-value .sheet-value{white-space:pre-wrap;overflow-wrap:anywhere;text-overflow:clip}
.sheet-grid .sheet-clip-value .sheet-value{text-overflow:clip}
.sheet-grid .sheet-wrap-value{height:auto;min-height:35px}
.sheet-grid.source-sheet td.sheet-selected{box-shadow:inset 0 0 0 1px #76a58a}
.sheet-grid.source-sheet td.sheet-active{box-shadow:inset 0 0 0 2px #3d755a}
.source-sheet .sheet-guidance th{height:22px;vertical-align:middle;padding:2px 5px}
.source-sheet .sheet-guidance .sheet-value{max-height:3.5em}
.source-sheet tbody td,.source-sheet tbody th{height:21px;padding-block:2px}
.source-sheet tbody .sheet-wrap-value{height:auto}

.team-user{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 8px;overflow-wrap:anywhere}.team-user small{display:block;width:100%}#main>.card>h1{margin-bottom:10px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><div><strong id="brand">Редакция</strong><small>Алёмаркетинг</small></div></div>
    <nav id="nav" aria-label="Разделы"></nav>
    <div id="team-user" class="team-user"></div>
    <div class="sync" role="status"><span aria-hidden="true"></span><div><strong id="sync">Загрузка…</strong><small id="sync-details"></small></div></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dialog"></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="./firebase-config.js"></script>
<script type="module">
const KIND = {
  social: {label:'Соцсети', icon:'◫', stage:'Стадия'},
  article: {label:'Статьи', icon:'▤', stage:'Что нужно сделать?'},
  case: {label:'Кейсы', icon:'▣', stage:'Статус'},
};
const OUTCOMES = {planned:'Запланировано', live:'Опубликовано', missed:'Не вышло'};
const BASE_COLUMNS = {
  title:'Рабочее название', format:'Тип публикации', channels:'Площадки', stage:'Стадия', owner:'Ответственный',
  deadline:'Дедлайн', next:'Ближайшая публикация', result:'Итоги публикаций', note:'Комментарий', description:'Подробнее',
  source:'Ссылка на исходник', expert:'Эксперт', announcement:'Анонс статьи в ТГ', tags:'Теги', sourceInfo:'Где берём информацию?',
  publishedUrl:'Ссылка на сайте', extras:'Дополнительная информация', start:'Старт работ', finish:'Финиш подготовки',
};
const ORDER = {
  social:['title','format','channels','stage','owner','deadline','next','result','description','source','note','start','finish'],
  article:['title','format','channels','stage','owner','deadline','next','result','description','source','expert','note','announcement'],
  case:['title','format','channels','stage','owner','deadline','next','result','tags','sourceInfo','note','publishedUrl','source','extras'],
};
const MULTILINE = ['description','sourceInfo','note','announcement','extras','recommendation','body'];
const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const TINTS = [['#dcebe9','#6c988b'],['#e6e6fa','#8176b6'],['#f5e7da','#b18461'],['#f5e2e8','#b77387'],['#e9efd9','#88a064'],['#e2ebf7','#7290b5']];
const id = () => globalThis.crypto?.randomUUID?.() ?? Array.from(crypto.getRandomValues(new Uint8Array(16)),n=>n.toString(16).padStart(2,'0')).join('');
const dayFormat = new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Minsk'});
const TODAY = () => dayFormat.format(new Date());
const isoDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d || '') && !Number.isNaN(Date.parse(d)) && new Date(d).toISOString().slice(0,10) === d;
function parseDate(value) {
  const match = String(value || '').trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?=\s|[-–—]|$)/);
  const candidate = match ? [match[3],match[2].padStart(2,'0'),match[1].padStart(2,'0')].join('-') : String(value || '').trim();
  return isoDate(candidate) ? candidate : '';
}
function plus(date, count) {
  const value = new Date(date+'T12:00:00Z');
  value.setUTCDate(value.getUTCDate()+count);
  return value.toISOString().slice(0,10);
}
const formatDate = d => isoDate(d) ? d.split('-').reverse().join('.') : '';
const weekday = d => new Date(d+'T12:00:00Z').getUTCDay() || 7;
const norm = s => String(s ?? '').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
const unique = values => [...new Set(values.filter(Boolean))];
const blank = () => ({
  version:2,materials:[],publications:[],topics:[],
  settings:{title:'Редакция',channels:[],formats:[],owners:[],rules:[],countPlanned:true,calendarDeadlines:false,
    outcomeLabels:{...OUTCOMES},kinds:Object.fromEntries(Object.entries(KIND).map(([key,value])=>[key,{label:value.label,
      stages:[], excluded:[],custom:[],hidden:[],order:[...ORDER[key]],labels:{stage:value.stage}}]))},
});
function validate(raw) {
  if (!raw || raw.version!==2 || !['materials','publications','topics'].every(k=>Array.isArray(raw[k]))) {
    throw new Error('Файл должен быть резервной копией приложения версии 2.');
  }
  const settings=raw.settings;
  if (!settings || !['channels','formats','owners','rules'].every(k=>Array.isArray(settings[k])) ||
      !Object.keys(KIND).every(k=>['stages','excluded','custom','hidden','order'].every(a=>Array.isArray(settings.kinds?.[k]?.[a])))) {
    throw new Error('В копии отсутствуют настройки рабочего пространства.');
  }
  for (const list of [raw.materials,raw.publications,raw.topics,settings.rules]) {

    const remoteRevision=current.exists()?current.data().revision:0;
    if(remoteRevision!==expected)throw Object.assign(Error('Конфликт версий'),{code:'workspace-conflict'});

async function push() {
  if(sending||!dirty||conflict||!remoteReady||!activeUser)return;
  sending=true;
  const data=structuredClone(db), session=generation;
  let retry=false;
  try {
    const next=await writeSnapshot(sdk,workspace,revision,data);
    if(session!==generation)return;
    dirty=JSON.stringify(db)!==JSON.stringify(data);
    revision=next;retry=dirty;
    setSync(dirty?'Сохраняем…':'Общий контент-план',dirty?'':'Изменения синхронизированы');
  } catch(error) {
    if(session!==generation)return;
    if(error.code==='workspace-conflict'){
      conflict=true;setSync('Есть конфликт версий','Скачай свою копию в настройках');
      notify('Коллега уже сохранил правки. Твои изменения пока в этой вкладке.');
      if(view==='settings'&&!isEditing())render();
    } else if(error.code==='workspace-too-large') {
      setSync('План слишком большой','Скачай копию в настройках');
    } else if(error.code==='permission-denied') {
      setSync('База отклонила сохранение','Проверь правила Firebase и скачай копию');
    } else {
      retry=true;setSync('Нет связи с базой','Правки доступны в этой вкладке');
    }
  } finally {
    if(session===generation)sending=false;
  }
  applyLatest();
  if(retry&&navigator.onLine) {
    clearTimeout(syncTimer);syncTimer=setTimeout(push,3500);
  }
}
async function pull() {
  try {
    const session=generation;
    const next=snapshotData(await sdk.getDocFromServer(workspace));
    if(session!==generation)return;
    latest=next;dirty=false;conflict=false;applyLatest(true);
  } catch {notify('Не удалось получить общую версию. Твои правки остались в этой вкладке.');}
}

async function initTeam() {
  const config=typeof firebaseConfig==='undefined'?null:firebaseConfig;
  if(location.protocol==='file:'){
    accessScreen('Командный контент-план','Открой опубликованный адрес GitHub Pages, чтобы войти.');
    return;
  }
  if(!config?.apiKey||!config?.projectId||!config?.authDomain||!config?.appId) {
    accessScreen('Подключи Firebase','Вставь настройки своего веб-приложения в firebase-config.js и сохрани файл в GitHub.');
    return;
  }
  try {
    const [appModule,authModule,dataModule]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js'),
    ]);
    const app=appModule.initializeApp(config);
    sdk={...authModule,...dataModule};
    auth=sdk.getAuth(app);
    workspace=sdk.doc(sdk.getFirestore(app),'editorial_workspace','team');
    sdk.onAuthStateChanged(auth,user=>{
      generation++;clearTimeout(syncTimer);clearTimeout(reconnect);
      if(unsubscribe)unsubscribe();
      activeUser=user;latest=undefined;remoteReady=false;db=blank();revision=0;dirty=false;sending=false;conflict=false;
      document.querySelector('#brand').textContent='Редакция';accountBar();
      if(!user)signInScreen();
      else {
        accessScreen('Открываем контент-план','Проверяем доступ к рабочему пространству.');
        listen(user);
      }
    },()=>signInScreen('Не удалось проверить вход в Firebase.'));
  } catch {
    accessScreen('Не удалось подключить Firebase','Проверь настройки проекта и подключение к интернету.',
      button('Повторить',initTeam));
  }
}

    else if(list)field(form,col.key,col.label,select(list.choices,source[col.key],'Не указано'));

      const value=el('output',formatDate(prepDate(source,col.key))||'Рассчитается по дедлайну','subtle');
      const wrap=el('label',col.label+' · авто','label');wrap.append(value);form.append(wrap);prepOutputs.set(col.key,value);
    }
    else textField(form,col.key,col.label,source[col.key],['deadline','start','finish'].includes(col.key)?'date':col.type||'text');
  }
  form.addEventListener('input',event=>{
    if(!prepOutputs.size||!['deadline','formats'].includes(event.target.name))return;
    const fields=new FormData(form), formats=fields.getAll('formats');
    const next={...source,kind,formats,deadline:fields.get('deadline')??'',
      formatTouched:source.formatTouched||formats.join(', ')!==joined(m,'format')};
    for(const [key,output] of prepOutputs)output.textContent=formatDate(prepDate(next,key))||'Нет даты';
  });
  if(m.sourceRow) form.append(link(m.sourceRow,'Открыть исходную строку в Google Таблице'));
  if(m.source) form.append(link(m.source,'Открыть исходник'));
  if(m.publishedUrl) form.append(link(m.publishedUrl,'Открыть на сайте'));
  const controls=[];
  if(m.id) controls.push(button('Удалить материал',()=>{
    if(!confirm('Удалить материал вместе со всеми его публикациями?'))return;
    db.materials=db.materials.filter(x=>x.id!==m.id);
    db.publications=db.publications.filter(x=>x.materialId!==m.id);
    changed();dialog.close();notify('Материал удалён.');
  },'danger'));
  formActions(form,'Сохранить материал',...controls);
  form.onsubmit=e=>{
    e.preventDefault();
    const formData=new FormData(form), values=Object.fromEntries(formData);
    const title=values.title.trim();
    if(!title){notify('Введите название материала.');return;}
    const next={...m,...values,title,id:m.id||id(),kind,formats:formData.getAll('formats'),channels:formData.getAll('channels')};
    if(next.formats.join(', ')!==joined(m,'format'))next.formatTouched=true;
    if(spec('tags'))next.tags=formData.getAll('tags').join(', ');
    upsert(db.materials,next);changed();dialog.close();notify('Материал сохранён.');
    if(preset.nextPublication) publicationEditor({}, {...preset.nextPublication,materialId:next.id});
  };
  content.append(form);
  if(m.id) {
    const area=el('div',null,'panel list');
    area.append(el('h3','Публикации материала'));
    for(const pub of byMaterial.get(m.id)||[]) area.append(line(
      [pub.channel,pub.format].filter(Boolean).join(' · ')||'Без площадки',
      [formatDate(eventDate(pub)),labelStatus(pub.status)].filter(Boolean).join(' · '),
      button('Редактировать',()=>publicationEditor(pub))));
    area.append(button('+ Публикация',()=>publicationEditor({}, {materialId:m.id})));
    if(m.topicId && topics.has(m.topicId)) area.append(button('Открыть тему',()=>topicEditor(topics.get(m.topicId))));
    content.append(area);
  }
  modal(m.id?'Материал':'Новый материал',content);
}

function parseTSV(text) {
  const rows=[[]];
  let cell='',quoted=false;
  for(let i=0;i<text.length;i++) {
    const c=text[i], next=text[i+1];
    if(quoted) {
      if(c==='"' && next==='"'){cell+='"';i++;}
      else if(c==='"') quoted=false;
      else cell+=c;
    } else if(c==='"' && !cell) quoted=true;
    else if(c==='\t'){rows.at(-1).push(cell);cell='';}
    else if(c==='\n' || c==='\r') {
      if(c==='\r' && next==='\n') i++;
      rows.at(-1).push(cell);cell='';rows.push([]);
    } else cell+=c;
  }
  if(cell || rows.at(-1).length) rows.at(-1).push(cell);else rows.pop();
  return rows;
}
const joined=(m,key)=>key==='format'?m?.formats?.join(', ')||'':key==='channels'?m?.channels?.join(', ')||'':m?.[key]||'';
const writeCell=(m,key,raw,type)=>{
  if(key==='title'){if(raw.trim())m.title=raw.trim();}
  else if(key==='format' || key==='channels') {
    const values=splitChoices(raw);
    if(key==='format'&&joined(m,key)!==values.join(', '))m.formatTouched=true;
    m[key==='format'?'formats':'channels']=values;
  }
  else if(['deadline','start','finish'].includes(key)||type==='date')m[key]=parseDate(raw);
  else m[key]=raw.trim();
};
function columnSettings(kind) {
  const cfg=db.settings.kinds[kind], content=el('div',null,'list');
  const cols=columns(kind,true);
  for(const [i,col] of cols.entries()){
    const controls=el('div',null,'actions');
    const hide=button(cfg.hidden.includes(col.key)?'Показать':'Скрыть',()=>{
      cfg.hidden=cfg.hidden.includes(col.key)?cfg.hidden.filter(key=>key!==col.key):[...cfg.hidden,col.key];changed();columnSettings(kind);
    });
    hide.disabled=col.key==='title';
    const up=button('↑',()=>{
      const keys=cols.map(c=>c.key);
      [keys[i-1],keys[i]]=[keys[i],keys[i-1]];
      if(sourceSheet(kind))cfg.sourceOrder=keys;else cfg.order=keys;
      changed();columnSettings(kind);
    },'icon','Поднять столбец '+col.label);
    up.disabled=sourceSheet(kind)?i===0:i<2;
    controls.append(up,hide,button('Изменить',()=>columnEditor(kind,col)));
    content.append(line(col.label,cfg.hidden.includes(col.key)?'Скрыт':'',controls));
  }
  content.append(button('+ Столбец',()=>columnEditor(kind),'primary'));
  modal('Столбцы · '+kindLabel(kind),content);
}
function columnEditor(kind,col={}) {
  const cfg=db.settings.kinds[kind], custom=cfg.custom.find(c=>c.key===col.key);
  const form=el('form',null,'grid');
  textField(form,'label','Название',col.label,'text',true);
  if(custom || !col.key) {
    field(form,'type','Тип поля',select([['text','Текст'],['textarea','Длинный текст'],['date','Дата'],['select','Список']],col.type||'text'));
    textField(form,'options','Варианты списка, каждый с новой строки',col.options?.join('\n'),'textarea');
  }
  formActions(form,'Сохранить',button('Назад',()=>columnSettings(kind)));
  form.onsubmit=e=>{
    e.preventDefault();
    const values=Object.fromEntries(new FormData(form)), label=values.label.trim();
    if(!label)return;
    if(col.key&&!custom) cfg.labels[col.key]=label;
    else {
      const key=col.key||'field_'+id();
      const definition={key,label,type:values.type,options:unique(values.options.split('\n').map(s=>s.trim()))};
      if(custom) Object.assign(custom,definition);
      else {cfg.custom.push(definition);cfg.order.push(key);}
    }
    changed();columnSettings(kind);
  };
  modal('Столбец',form);
}
function listText(value) {return unique(String(value||'').split('\n').map(value=>value.trim()));}
function namesSettings(key,label,old='') {
  const form=el('form',null,'grid');
  textField(form,'name','Название',old,'text',true);
  const remove=button('Убрать из справочника',()=>{
    if(!confirm('Убрать значение из справочника? Карточки и нормы с этим значением сохранятся.'))return;
    db.settings[key]=db.settings[key].filter(value=>value!==old);changed();dialog.close();
  },'danger');
  formActions(form,'Сохранить',...(old?[remove]:[]));
  form.onsubmit=e=>{
    e.preventDefault();
    const value=String(new FormData(form).get('name')).trim();
    if(!value)return;
    db.settings[key]=unique([...db.settings[key].filter(v=>v!==old),value]);
    if(old && old!==value){
      if(key==='owners') db.materials.forEach(m=>{if(m.owner===old)m.owner=value;});
      else {
        db.materials.forEach(m=>{m.formats=unique(m.formats.map(f=>f===old?value:f));});
        [...db.publications,...db.settings.rules].forEach(r=>{if(r.format===old)r.format=value;});
      }
    }
    changed();dialog.close();
  };
  modal(label,form);
}
function channelEditor(record={}) {
  const form=el('form',null,'grid');
  textField(form,'name','Название площадки',record.name,'text',true);
  textField(form,'recommendation','Правила и рекомендации для публикаций',record.recommendation);
  for(const [i,day] of DAYS.entries()) textField(form,'day'+(i+1),day,record.schedule?.[i+1],'textarea');
  const remove=button('Убрать из справочника',()=>{
    if(!confirm('Убрать площадку из справочника? Карточки и нормы сохранятся.'))return;
    db.settings.channels=db.settings.channels.filter(c=>c.name!==record.name);changed();dialog.close();
  },'danger');
  formActions(form,'Сохранить',...(record.name?[remove]:[]));
  form.onsubmit=e=>{
    e.preventDefault();
    const v=Object.fromEntries(new FormData(form)), name=v.name.trim();
    if(!name)return;
    if(name!==record.name && db.settings.channels.some(c=>norm(c.name)===norm(name))) {notify('Такая площадка уже есть.');return;}
    const schedule=Object.fromEntries(DAYS.map((_,i)=>[i+1,v['day'+(i+1)].trim()]));
    const next={name,recommendation:v.recommendation.trim(),schedule};
    db.settings.channels=db.settings.channels.map(c=>c.name===record.name?next:c);
    if(!db.settings.channels.some(c=>c.name===name)) db.settings.channels.push(next);
    if(record.name && record.name!==name){
      db.materials.forEach(m=>{m.channels=unique(m.channels.map(c=>c===record.name?name:c));});
      [...db.publications,...db.settings.rules].forEach(r=>{if(r.channel===record.name)r.channel=name;});
    }
    changed();dialog.close();
  };
  modal('Площадка и график',form);
}
function ruleEditor(rule={}) {
  const form=el('form',null,'grid');
  field(form,'channel','Площадка',select(channelNames(),rule.channel,'Выбрать площадку'),{required:true});
  field(form,'format','Формат',select(formatNames(),rule.format,'Любой формат'));
  field(form,'slot','Период',select([['month','Месяц'],...DAYS.map((day,i)=>[String(i+1),day])],rule.period==='day'?String(rule.day):'month'));
  const min=textField(form,'min','Минимум публикаций',rule.min||1,'number',true);min.min='1';min.max='999';
  const remove=button('Удалить норму',()=>{db.settings.rules=db.settings.rules.filter(r=>r.id!==rule.id);changed();dialog.close()},'danger');
  formActions(form,'Сохранить',...(rule.id?[remove]:[]));
  form.onsubmit=e=>{
    e.preventDefault();
    const v=Object.fromEntries(new FormData(form)), period=v.slot==='month'?'month':'day', day=Number(v.slot)||0;
    upsert(db.settings.rules,{id:rule.id||id(),channel:v.channel,format:v.format,period,day,min:Number(v.min)});
    changed();dialog.close();
  };
  modal('Норма публикаций',form);
}
function kindSettings(kind) {
  const form=el('form',null,'grid'), cfg=db.settings.kinds[kind];

function settings() {
  top('Настройки','Справочники, нормы, колонки и резервные копии рабочего пространства.');
  const grid=el('div',null,'settings');main.append(grid);
  const panel=title=>{const body=el('section',null,'panel list');body.append(el('h2',title));grid.append(body);return body;};
  const general=panel('Рабочее пространство'), form=el('form',null,'list');
  textField(form,'title','Название рабочего пространства',db.settings.title,'text',true);
  field(form,'quota','Норму закрывают',select([['planned','Запланированные и опубликованные'],['live','Только опубликованные']],db.settings.countPlanned?'planned':'live'));
  field(form,'deadlines','Показывать дедлайны в календаре',select([['no','Нет'],['yes','Да']],db.settings.calendarDeadlines?'yes':'no'));
  for(const key of Object.keys(OUTCOMES)) textField(form,'outcome-'+key,OUTCOMES[key],db.settings.outcomeLabels?.[key]||OUTCOMES[key],'text',true);
  formActions(form,'Сохранить настройки');
  form.onsubmit=e=>{
    e.preventDefault();
    const v=Object.fromEntries(new FormData(form));
    Object.assign(db.settings,{title:v.title.trim()||'Редакция',countPlanned:v.quota==='planned',calendarDeadlines:v.deadlines==='yes',
      outcomeLabels:Object.fromEntries(Object.keys(OUTCOMES).map(k=>[k,v['outcome-'+k].trim()||OUTCOMES[k]]))});changed();notify('Настройки сохранены.');
  };
  general.append(form);

  const channels=panel('Площадки и рекомендации');
  for(const channel of db.settings.channels) channels.append(line(channel.name,'',button('Изменить',()=>channelEditor(channel))));
  channels.append(button('+ Площадка',()=>channelEditor()));
  const rules=panel('Нормы публикаций');
  for(const rule of db.settings.rules) rules.append(line(rule.channel,
    [rule.format||'Любой формат',rule.period==='month'?'Месяц':DAYS[rule.day-1],'Минимум '+rule.min].join(' · '),
    button('Изменить',()=>ruleEditor(rule))));
  rules.append(button('+ Норма',()=>ruleEditor()));
  const prep=panel('Авторасчёт подготовки');
  for(const kind of Object.keys(KIND)){
    prep.append(line(kindLabel(kind),prepConfig(kind).enabled?'По рабочим дням от дедлайна':'Выключено',
      button('Настроить сроки',()=>prepSettings(kind))));
  }
  const production=panel('Таблицы производства');
  for(const k of Object.keys(KIND)) production.append(line(kindLabel(k),'',button('Настроить',()=>kindSettings(k))));
  for(const [key,labels] of Object.entries({formats:['Форматы','Формат'],owners:['Ответственные','Ответственный']})) {
    const box=panel(labels[0]);
    for(const name of db.settings[key]) box.append(line(name,'',button('Изменить',()=>namesSettings(key,labels[1],name))));
    box.append(button('+ '+labels[1],()=>namesSettings(key,labels[1])));
  }
  const designPanel=panel('Оформление Google Таблиц');
  const designFile=el('input');designFile.type='file';designFile.accept='.json,application/json';designFile.hidden=true;
  designPanel.append(el('p','Применяет оформление и списки к существующим строкам. Содержимое плана сохраняется.','subtle'),
    designFile,button('Загрузить оформление',()=>designFile.click()));
  designFile.onchange=async()=>{
    try{
      const file=designFile.files[0];if(!file)return;
      if(file.size>250000)throw Error('Файл оформления слишком большой.');
      installSourceDesign(JSON.parse(await file.text()));changed();notify('Оформление и выпадающие списки применены.');
    }catch(error){notify(error.message);}finally{designFile.value='';}
  };
  const storage=panel('Резервная копия');
  storage.append(button('Скачать JSON',()=>{
    const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
    const a=el('a');a.href=url;a.download='content-plan-'+TODAY()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }));
  const upload=el('input');upload.type='file';upload.accept='.json,application/json';upload.hidden=true;
  storage.append(upload,button('Загрузить JSON',()=>upload.click()));
  upload.onchange=async()=>{
    try{
      const file=upload.files[0];if(!file)return;
      if(file.size>1_900_000) throw new Error('Файл слишком большой.');
      const next=validate(JSON.parse(await file.text()));
      if(new TextEncoder().encode(JSON.stringify(next)).byteLength>maxSize)throw new Error('Данные из файла превышают лимит облачной версии 850 КБ.');
      if((db.materials.length||db.publications.length||db.topics.length)&&!confirm('Заменить всё рабочее пространство данными из файла?'))return;
      if(db.settings.sourceDesign&&!next.settings.sourceDesign)next.settings.sourceDesign=db.settings.sourceDesign;
      db=next;changed();notify('Резервная копия загружена.');
    }catch(error){notify(error.message);}finally{upload.value='';}
  };
  if(conflict) storage.append(button('Загрузить общую версию',()=>{
    if(!confirm('Заменить локальные правки общей версией? Скачайте копию, чтобы сохранить правки.'))return;
    pull();
  },'danger'));
}
